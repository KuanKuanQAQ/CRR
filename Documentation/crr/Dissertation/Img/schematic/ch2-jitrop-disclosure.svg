<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" width="720" height="456"
     font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<!-- 图 2-1 JIT-ROP 信息泄露攻击流程 -->
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker>
  <marker id="ahb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0072B2"/></marker>
  <marker id="ahg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker>
  <marker id="ahr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D55E00"/></marker>
  <marker id="ahy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0072B2"/></marker>
  <marker id="ahm" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#999"/></marker>
  <marker id="sq" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="0"><rect x="1" y="1" width="8" height="8" fill="#000"/></marker>
  <marker id="ci" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="0"><circle cx="5" cy="5" r="3.6" fill="#fff" stroke="#000" stroke-width="1.3"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern>
</defs>
<style>
  .lbl  { font-size:11.5px; fill:#000; letter-spacing:.06em; }
  .box  { fill:#fff; stroke:#000; stroke-width:1.2; }
  .plain{ fill:#fff; stroke:#000; stroke-width:0.8; }
  .nr   { fill:#fff; stroke:#000; stroke-width:1.2; stroke-dasharray:6 3; }
  .tr   { fill:#fff; stroke:#0072B2; stroke-width:2; }
  .rd   { fill:#F0F0F0; stroke:#000; stroke-width:1.2; stroke-dasharray:1.5 2.5; }
  .dt   { fill:#E3EEF7; stroke:#0072B2; stroke-width:2; }
  .hw   { fill:#EDEDED; stroke:#555; stroke-width:1.2; }
  .ours { fill:#E3EEF7; stroke:#0072B2; stroke-width:2; }
  .dis  { fill:#fff; stroke:#555; stroke-width:0.8; stroke-dasharray:2 2; }
  .bad  { font-size:11.5px; fill:#D55E00; font-weight:bold; }
  .concl{ fill:#E3EEF7; stroke:#0072B2; stroke-width:1.6; }
  .ghost{ fill:#fff; stroke:#D55E00; stroke-width:1.2; stroke-dasharray:4 3; }
  .trap { fill:url(#hatch); stroke:#000; stroke-width:1.2; }
  .c5   { fill:#E3EEF7; stroke:#0072B2; stroke-width:1.4; }
  .bt   { font-size:12.5px; fill:#000; text-anchor:middle; }
  .btl  { font-size:12.5px; fill:#000; }
  .bs   { font-size:11px; fill:#000; text-anchor:middle; }
  .bsl  { font-size:11px; fill:#000; }
  .ttl  { font-size:13.5px; fill:#000; font-weight:bold; text-anchor:middle; }
  .ttll { font-size:13.5px; fill:#000; font-weight:bold; }
  .mono { font-family:"SF Mono",Menlo,Consolas,ui-monospace,monospace; font-size:11.5px; fill:#000; }
  .monos{ font-family:"SF Mono",Menlo,Consolas,ui-monospace,monospace; font-size:10.5px; fill:#000; }
  .mn   { fill:#000; font-weight:bold; }
  .off  { fill:#555; }
  .cap  { font-size:11px; fill:#333; }
  .capc { font-size:11px; fill:#333; text-anchor:middle; }
  .note { font-size:11.5px; fill:#000; }
  .key  { font-size:11.5px; fill:#0072B2; font-weight:bold; }
  .keyc { font-size:11.5px; fill:#0072B2; font-weight:bold; text-anchor:middle; }
  .red  { font-size:11.5px; fill:#D55E00; font-weight:bold; }
  .redc { font-size:11.5px; fill:#D55E00; font-weight:bold; text-anchor:middle; }
  .good { font-size:11.5px; fill:#000; font-weight:bold; }
  .goodc{ font-size:11.5px; fill:#000; font-weight:bold; text-anchor:middle; }
  .gold { font-size:11.5px; fill:#000; font-weight:bold; }
  .cf   { fill:none; stroke:#000; stroke-width:1.3; marker-end:url(#ah); }
  .cfb  { fill:none; stroke:#0072B2; stroke-width:2; marker-end:url(#ahb); }
  .cfg  { fill:none; stroke:#000; stroke-width:1.3; marker-end:url(#ahg); }
  .cfr  { fill:none; stroke:#D55E00; stroke-width:1.6; stroke-dasharray:7 3; marker-end:url(#ahr); }
  .cfy  { fill:none; stroke:#0072B2; stroke-width:2; marker-end:url(#ahy); }
  .cfm  { fill:none; stroke:#999; stroke-width:1; marker-end:url(#ahm); }
  .df   { fill:none; stroke:#555; stroke-width:1.1; stroke-dasharray:4 3; marker-end:url(#ahm); }
  .dfb  { fill:none; stroke:#0072B2; stroke-width:1.3; stroke-dasharray:4 3; marker-end:url(#ahb); }
  .dfr  { fill:none; stroke:#D55E00; stroke-width:1.3; stroke-dasharray:4 3; marker-end:url(#ahr); }
  .dfy  { fill:none; stroke:#0072B2; stroke-width:1.3; stroke-dasharray:4 3; marker-end:url(#ahy); }
  .dep  { fill:none; stroke:#D55E00; stroke-width:1.1; stroke-dasharray:6 4; marker-end:url(#ahr); }
  .ln   { fill:none; stroke:#000; stroke-width:1.1; }
  .lnr  { fill:none; stroke:#D55E00; stroke-width:1.6; }
  .lng  { fill:none; stroke:#000; stroke-width:1.3; }
  .dash { fill:none; stroke:#000; stroke-width:1; stroke-dasharray:5 4; }
  .div  { stroke:#000; stroke-width:0.6; }
  .axis { stroke:#000; stroke-width:1.1; fill:none; }
  .grid { stroke:#999; stroke-width:0.5; stroke-dasharray:2 3; }
</style>
<rect width="720" height="456" fill="#fff"/>
<text class="lbl" x="30" y="40">内核代码段（装载时随机化，运行期布局固定）</text>
<text class="lbl" x="440" y="40">攻击者（运行期）</text>
<rect class="dt" x="70" y="187" width="120" height="36"/>
<rect class="dt" x="70" y="310" width="120" height="18"/>
<rect class="box" x="60" y="54" width="330" height="96"/>
<text class="ttll" x="74" y="71">页 A</text>
<text class="mono" x="76" y="90" xml:space="preserve">func_a:</text>
<text class="mono" x="76" y="107" xml:space="preserve">  <tspan class="mn">mov</tspan>  rax,[rdi]</text>
<text class="mono" x="76" y="124" xml:space="preserve">  <tspan class="mn">jmp</tspan>  func_b<tspan class="off">     ; 直接跳转 → 页 B</tspan></text>
<rect class="box" x="60" y="166" width="330" height="96"/>
<text class="ttll" x="74" y="183">页 B</text>
<text class="mono" x="76" y="202" xml:space="preserve">func_b:</text>
<text class="mono" x="76" y="219" xml:space="preserve">  <tspan class="mn">pop</tspan>  rdi</text>
<text class="mono" x="76" y="236" xml:space="preserve">  <tspan class="mn">ret</tspan><tspan class="off">             ; gadget</tspan></text>
<text class="mono" x="76" y="253" xml:space="preserve">  <tspan class="mn">call</tspan> func_c<tspan class="off">     ; 直接调用 → 页 C</tspan></text>
<rect class="box" x="60" y="278" width="330" height="96"/>
<text class="ttll" x="74" y="295">页 C</text>
<text class="mono" x="76" y="314" xml:space="preserve">func_c:</text>
<text class="mono" x="76" y="331" xml:space="preserve">  <tspan class="mn">mov</tspan>  eax,0x3b</text>
<text class="mono" x="76" y="348" xml:space="preserve">  <tspan class="mn">syscall</tspan><tspan class="off">         ; gadget</tspan></text>
<path class="cf" d="M60,124 L42,124 L42,202 L60,202"/>
<path class="cf" d="M60,253 L42,253 L42,314 L60,314"/>
<rect class="nr" x="440" y="58" width="250" height="34"/>
<circle cx="462" cy="75" r="9" fill="#0072B2"/><text x="462" y="79" text-anchor="middle" fill="#fff" font-weight="600" font-size="11.5">1</text>
<text class="btl" x="480" y="79">泄露一个代码指针</text>
<rect class="nr" x="440" y="120" width="250" height="34"/>
<circle cx="462" cy="137" r="9" fill="#0072B2"/><text x="462" y="141" text-anchor="middle" fill="#fff" font-weight="600" font-size="11.5">2</text>
<text class="btl" x="480" y="141">读取该页并反汇编</text>
<rect class="nr" x="440" y="182" width="250" height="34"/>
<circle cx="462" cy="199" r="9" fill="#0072B2"/><text x="462" y="203" text-anchor="middle" fill="#fff" font-weight="600" font-size="11.5">3</text>
<text class="btl" x="480" y="203">顺边指针递归扫描</text>
<rect class="nr" x="440" y="244" width="250" height="34"/>
<circle cx="462" cy="261" r="9" fill="#0072B2"/><text x="462" y="265" text-anchor="middle" fill="#fff" font-weight="600" font-size="11.5">4</text>
<text class="btl" x="480" y="265">拼接攻击载荷</text>
<path class="cfr" d="M440,75 L392,75"/>
<path class="df" d="M390,102 L440,132"/>
<path class="df" d="M390,214 L440,196"/>
<path class="df" d="M390,326 L440,204"/>
<rect class="box" x="440" y="300" width="250" height="100"/>
<text class="ttll" x="452" y="318">攻击载荷（栈上）</text>
<rect class="dt" x="452" y="328" width="226" height="20"/>
<text class="monos" x="460" y="342" xml:space="preserve">地址(pop rdi ; ret)  ← 页 B</text>
<rect class="dt" x="452" y="350" width="226" height="20"/>
<text class="monos" x="460" y="364" xml:space="preserve">0x…<tspan class="off">                  ; rdi 的值</tspan></text>
<rect class="dt" x="452" y="372" width="226" height="20"/>
<text class="monos" x="460" y="386" xml:space="preserve">地址(syscall)        ← 页 C</text>
<path class="cf" d="M565,286 L565,300"/>
<rect class="dt" x="30" y="430" width="22" height="13"/>
<text class="cap" x="58" y="440">gadget / 载荷条目</text>
<path class="cf" d="M185.34,436 L215.34,436"/>
<text class="cap" x="221.34" y="440">直接跳转或调用（边指针）</text>
<path class="df" d="M371.34,436 L401.34,436"/>
<text class="cap" x="407.34" y="440">读取代码页</text>
<path class="cfr" d="M480.34,436 L510.34,436"/>
<text class="cap" x="516.34" y="440">泄露得到的指针</text>
</svg>
