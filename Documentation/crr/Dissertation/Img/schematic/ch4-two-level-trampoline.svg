<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486" width="720" height="486"
     font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<!-- 图 4-3 两级跳板与跳板激活 -->
<defs>
  <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker>
  <marker id="ahs" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker>
  <marker id="oah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0.6,0.6 L7,4 L0.6,7.4 z" fill="#fff" stroke="#000" stroke-width="1"/></marker>
  <marker id="ahb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0072B2"/></marker>
  <marker id="ahr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D55E00"/></marker>
  <marker id="ahg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern>
  <pattern id="hatch2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="5" height="5" fill="#fff"/><line x1="0" y1="0" x2="0" y2="5" stroke="#000" stroke-width="0.7"/></pattern>
  <pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="0.9" fill="#000"/></pattern>
</defs>
<style>
  text  { fill:#000; }
  .lbl  { font-size:11.5px; letter-spacing:.06em; }
  .box  { fill:#fff; stroke:#000; stroke-width:1.2; }
  .thick{ fill:#fff; stroke:#000; stroke-width:2; }
  .plain{ fill:#fff; stroke:#000; stroke-width:0.8; }
  .nr   { fill:#fff; stroke:#000; stroke-width:1.2; stroke-dasharray:6 3; }
  .tr   { fill:#fff; stroke:#0072B2; stroke-width:2; }
  .rd   { fill:#F0F0F0; stroke:#000; stroke-width:1.2; stroke-dasharray:1.5 2.5; }
  .dt   { fill:#E3EEF7; stroke:#0072B2; stroke-width:2; }
  .hw   { fill:#EDEDED; stroke:#555; stroke-width:1.2; }
  .ours { fill:#E3EEF7; stroke:#0072B2; stroke-width:2; }
  .dis  { fill:#fff; stroke:#000; stroke-width:0.8; stroke-dasharray:2 2; }
  .concl{ fill:#E3EEF7; stroke:#0072B2; stroke-width:1.6; }
  .ghost{ fill:#fff; stroke:#D55E00; stroke-width:1.2; stroke-dasharray:4 3; }
  .trap { fill:url(#hatch); stroke:#000; stroke-width:1.2; }
  .shade{ fill:url(#hatch2); stroke:#000; stroke-width:1; }
  .dotf { fill:url(#dots); stroke:#000; stroke-width:1.2; }
  .c5   { fill:#fff; stroke:#000; stroke-width:1.2; }
  .bt   { font-size:12.5px; text-anchor:middle; }
  .btl  { font-size:12.5px; }
  .bs   { font-size:11px; text-anchor:middle; }
  .bsl  { font-size:11px; }
  .ttl  { font-size:13.5px; font-weight:bold; text-anchor:middle; }
  .ttll { font-size:13.5px; font-weight:bold; }
  .mono { font-family:"SF Mono",Menlo,Consolas,"Courier New",monospace; font-size:11.5px; }
  .monos{ font-family:"SF Mono",Menlo,Consolas,"Courier New",monospace; font-size:10.5px; }
  .mn   { fill:#000; font-weight:bold; }
  .off  { fill:#555; }
  .cap  { font-size:11px; fill:#333; }
  .capc { font-size:11px; fill:#333; text-anchor:middle; }
  .note { font-size:11.5px; }
  .key  { font-size:11.5px; font-weight:bold; fill:#0072B2; }
  .keyc { font-size:11.5px; font-weight:bold; text-anchor:middle; fill:#0072B2; }
  .red  { font-size:11.5px; font-weight:bold; fill:#D55E00; }
  .redc { font-size:11.5px; font-weight:bold; text-anchor:middle; fill:#D55E00; }
  .good { font-size:11.5px; font-weight:bold; }
  .goodc{ font-size:11.5px; font-weight:bold; text-anchor:middle; }
  .gold { font-size:11.5px; font-weight:bold; }
  .cf   { fill:none; stroke:#000; stroke-width:1.3; marker-end:url(#ah); }
  .cfb  { fill:none; stroke:#0072B2; stroke-width:2; marker-end:url(#ahb); }
  .cfg  { fill:none; stroke:#000; stroke-width:1.3; marker-end:url(#ah); }
  .cfr  { fill:none; stroke:#D55E00; stroke-width:1.6; stroke-dasharray:7 3; marker-end:url(#ahr); }
  .cfy  { fill:none; stroke:#0072B2; stroke-width:2; marker-end:url(#ahb); }
  .cfm  { fill:none; stroke:#000; stroke-width:0.9; marker-end:url(#ahs); }
  .cfo  { fill:none; stroke:#000; stroke-width:1.3; marker-end:url(#oah); }
  .df   { fill:none; stroke:#555; stroke-width:1.1; stroke-dasharray:4 3; marker-end:url(#ahg); }
  .dfb  { fill:none; stroke:#0072B2; stroke-width:1.3; stroke-dasharray:4 3; marker-end:url(#ahb); }
  .dfr  { fill:none; stroke:#D55E00; stroke-width:1.3; stroke-dasharray:4 3; marker-end:url(#ahr); }
  .dfy  { fill:none; stroke:#0072B2; stroke-width:1.3; stroke-dasharray:4 3; marker-end:url(#ahb); }
  .dep  { fill:none; stroke:#000; stroke-width:1.1; stroke-dasharray:6 4; marker-end:url(#ahs); }
  .ln   { fill:none; stroke:#000; stroke-width:1.1; }
  .lnr  { fill:none; stroke:#D55E00; stroke-width:1.6; }
  .lng  { fill:none; stroke:#000; stroke-width:1.3; }
  .dash { fill:none; stroke:#000; stroke-width:1; stroke-dasharray:5 4; }
  .div  { stroke:#000; stroke-width:0.6; }
  .axis { stroke:#000; stroke-width:1.1; fill:none; }
  .grid { stroke:#999; stroke-width:0.5; stroke-dasharray:2 3; }
</style>
<rect width="720" height="486" fill="#fff"/>
<text class="lbl" x="30" y="40">一级跳板的两种状态（同一对跳转桩）</text>
<text class="lbl" x="400" y="40">激活的四步</text>
<rect class="box" x="30" y="56" width="142" height="80"/>
<text class="bt" x="101" y="76">未激活态</text>
<text class="monos" x="40" y="98" xml:space="preserve"><tspan class="mn">b</tspan> stub_F</text>
<text class="monos" x="40" y="115" xml:space="preserve">; 桩内 b F_entry</text>
<rect class="thick" x="218" y="56" width="142" height="80"/>
<text class="bt" x="289" y="76">激活态</text>
<text class="monos" x="226" y="98" xml:space="preserve"><tspan class="mn">b</tspan>   fixed_in2_F</text>
<text class="monos" x="226" y="115" xml:space="preserve">(同一条指令，改立即数)</text>
<path class="cfy" d="M176,96 L214,96"/>
<text class="cap" x="150" y="150">激活：一条指令的原子写入</text>
<rect class="dt" x="30" y="172" width="160" height="34"/>
<text class="bt" x="110" y="194">stub_F（跳转桩区）</text>
<path class="df" d="M101,136 L101,172"/>
<path class="df" d="M289,136 L289,226"/>
<rect class="thick" x="200" y="226" width="160" height="96"/>
<text class="bt" x="280" y="246">二级跳板 fixed_in2_F</text>
<text class="monos" x="210" y="268" xml:space="preserve">标志 0→1，计数 +1</text>
<text class="monos" x="210" y="285" xml:space="preserve"><tspan class="mn">bl</tspan> stub_F</text>
<text class="monos" x="210" y="302" xml:space="preserve">标志 1→0，计数 −1</text>
<path class="df" d="M200,300 L140,300 L140,206"/>
<rect class="rd" x="30" y="340" width="330" height="56"/>
<text class="bt" x="195" y="360">F_body 当前变体</text>
<text class="bs" x="195" y="378">两态经同一跳转桩到达；返回标记经重入桩解析</text>
<path class="cf" d="M110,206 L110,340"/>
<rect class="box" x="30" y="414" width="330" height="66"/>
<text class="bt" x="195" y="434">出口跳板：以每任务的内外标志判定是否记账</text>
<text class="bs" x="195" y="452">标志为 0 → 不记账不查白名单，直接调用并按标记返回</text>
<text class="bs" x="195" y="470">标志为 1 → 第 3 章的完整序列</text>
<rect class="box" x="400" y="56" width="290" height="74"/>
<circle cx="412" cy="74" r="8.5" fill="#0072B2"/><text x="412" y="77.8" text-anchor="middle" fill="#fff" font-weight="600" font-size="11">1</text>
<text class="btl" x="426" y="78">激活：一级跳板改指二级跳板</text>
<text class="bsl" x="412" y="100">此后无合法路径新进入旧副本</text>
<path class="cf" d="M545,130 L545,152"/>
<rect class="box" x="400" y="152" width="290" height="74"/>
<circle cx="412" cy="170" r="8.5" fill="#0072B2"/><text x="412" y="173.8" text-anchor="middle" fill="#fff" font-weight="600" font-size="11">2</text>
<text class="btl" x="426" y="174">新执行流经二级跳板计数</text>
<text class="bsl" x="412" y="196">激活前进入者标志为 0，出口不记账</text>
<path class="cf" d="M545,226 L545,248"/>
<rect class="box" x="400" y="248" width="290" height="74"/>
<circle cx="412" cy="266" r="8.5" fill="#0072B2"/><text x="412" y="269.8" text-anchor="middle" fill="#fff" font-weight="600" font-size="11">3</text>
<text class="btl" x="426" y="270">搬移 F，改写 stub_F</text>
<text class="bsl" x="412" y="292">返回标记自动解析到新变体</text>
<path class="cf" d="M545,322 L545,344"/>
<rect class="box" x="400" y="344" width="290" height="74"/>
<circle cx="412" cy="362" r="8.5" fill="#0072B2"/><text x="412" y="365.8" text-anchor="middle" fill="#fff" font-weight="600" font-size="11">4</text>
<text class="btl" x="426" y="366">扫描栈、保存现场与各核 PC</text>
<text class="bsl" x="412" y="388">无滞留者 → 旧副本填陷阱；否则重试，兜底 rcu_tasks</text>
<rect class="dt" x="30" y="460" width="22" height="13"/>
<text class="cap" x="58" y="470">跳转桩</text>
<rect class="thick" x="109" y="460" width="22" height="13"/>
<text class="cap" x="137" y="470">二级跳板 / 激活态</text>
<rect class="rd" x="251.8" y="460" width="22" height="13"/>
<text class="cap" x="279.8" y="470">函数体</text>
<path class="cfy" d="M330.8,466 L360.8,466"/>
<text class="cap" x="366.8" y="470">激活 / 降级</text>
<path class="df" d="M448.6,466 L478.6,466"/>
<text class="cap" x="484.6" y="470">读跳转桩</text>
</svg>
