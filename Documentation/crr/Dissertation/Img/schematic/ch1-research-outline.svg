<path class="cf" d="M124,240 L154,240"/>
<path class="cf" d="M282,240 L316,240"/>
<path class="cf" d="M462,240 L498,240"/>
<rect class="box" x="158" y="300" width="124" height="72"/>
<text class="bs" x="220" y="332">范围之外的代码</text>
