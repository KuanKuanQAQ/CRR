<rect class="box" x="320" y="300" width="142" height="72" style="fill:#FAE4D6;stroke:#D55E00"/>
<text class="bs" x="391" y="332">非随机化区域布局固定</text>
<text class="bs" x="391" y="350">指针认证受上下文传播所限</text>
<rect class="ours" x="502" y="300" width="184" height="72"/>
