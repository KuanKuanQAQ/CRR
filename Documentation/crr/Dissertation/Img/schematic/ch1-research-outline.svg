<rect class="box" x="320" y="108" width="142" height="72" style="fill:#FAE4D6;stroke:#D55E00"/>
<text class="bs" x="391" y="140">代码索引规模随调用点增长</text>
<text class="bs" x="391" y="158">执行流无法安全暂停</text>
<rect class="ours" x="502" y="108" width="184" height="72"/>
<text class="bs" x="594" y="140">研究内容一：基于跳板函数的</text>
<text class="bs" x="594" y="158">持续随机化</text>
<path class="cf" d="M124,144 L154,144"/>
<path class="cf" d="M282,144 L316,144"/>
<path class="cf" d="M462,144 L498,144"/>
<rect class="box" x="158" y="204" width="124" height="72"/>
<text class="bs" x="220" y="236">随机化哪些函数</text>
<text class="bs" x="220" y="254">何时随机化</text>
<rect class="box" x="320" y="204" width="142" height="72" style="fill:#FAE4D6;stroke:#D55E00"/>
<text class="bs" x="391" y="236">范围扩大则开销剧增</text>
<text class="bs" x="391" y="254">跨区域调用随之增多</text>
<rect class="ours" x="502" y="204" width="184" height="72"/>
<text class="bs" x="594" y="236">研究内容二：基于代码索引泄露的</text>
